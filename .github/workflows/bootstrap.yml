name: Bootstrap DemoX 4.7.2

on:
  push:
    branches:
      - feature/building-placement

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/building-placement
      - name: Apply verified feature patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          git reset --hard a70e4f6b8758af12773797fc25282d05517a73c8
          printf '%s' '' | base64 --decode | gunzip > /tmp/demox.patch
          git apply /tmp/demox.patch
          rm .github/workflows/build-windows.yml
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add 3x3 building placement and Windows export"
      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -L --fail --retry 3 -o godot.zip "${base_url}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl -L --fail --retry 3 -o templates.tpz "${base_url}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q godot.zip -d .godot-bin
          chmod +x ".godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q templates.tpz -d .godot-templates
          mv .godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          echo "$PWD/.godot-bin" >> "$GITHUB_PATH"
      - name: Import and test
        shell: bash
        run: |
          set -euo pipefail
          godot="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$godot" --headless --path . --editor --quit-after 3
          "$godot" --headless --path . --script res://tests/board_core_test.gd
          "$godot" --headless --path . --script res://tests/building_placement_test.gd
      - name: Export Windows x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" --headless --path . --export-release "Windows Desktop" build/windows/DemoX.exe
          test -s build/windows/DemoX.exe
      - name: Push completed branch
        shell: bash
        run: git push --force-with-lease origin HEAD:feature/building-placement
      - name: Upload DemoX-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: DemoX-Windows
          path: build/windows/DemoX.exe
          if-no-files-found: error
