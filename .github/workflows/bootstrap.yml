name: Build Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -L --fail --retry 3 -o godot.zip \
            "${base_url}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl -L --fail --retry 3 -o templates.tpz \
            "${base_url}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q godot.zip -d .godot-bin
          chmod +x ".godot-bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q templates.tpz -d .godot-templates
          mv .godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          echo "$PWD/.godot-bin" >> "$GITHUB_PATH"

      - name: Import project
        shell: bash
        run: |
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --editor --quit-after 3

      - name: Run gameplay tests
        shell: bash
        run: |
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/board_core_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/building_placement_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/s10_event_engine_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/s11_merit_promotion_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/s11_progression_ui_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/turn_resolver_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/building_architecture_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/resource_staffing_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/expedition_system_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/prisoner_lifecycle_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/information_system_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/world_system_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/final_ui_flow_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/outsider_system_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/s12_perimeter_relationship_test.gd
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/s12b_social_core_test.gd

      - name: Export Windows x86_64
        shell: bash
        run: |
          mkdir -p build/windows
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --export-release "Windows Desktop" build/windows/DemoX.exe
          test -s build/windows/DemoX.exe

      - name: Upload DemoX-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: DemoX-Windows
          path: build/windows/DemoX.exe
          if-no-files-found: error
