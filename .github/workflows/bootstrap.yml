name: Push Turn Resolver

on:
  workflow_dispatch:
  push:
    branches:
      - feature/turn-resolver

permissions:
  contents: write

jobs:
  apply-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/turn-resolver
      - name: Apply turn resolver patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' '' >> /tmp/turn-resolver.patch.b64
          printf '%s' 'g/dHfEXsS96N/f3ab6KFuv57dF/A8jf4GNpjAAA=' >> /tmp/turn-resolver.patch.b64
          base64 --decode /tmp/turn-resolver.patch.b64 | gunzip > /tmp/turn-resolver.patch
          git apply /tmp/turn-resolver.patch
          git add src tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add phased end-day turn resolver [skip ci]"
          git push origin HEAD:feature/turn-resolver
